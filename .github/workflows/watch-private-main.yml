name: Watch private main

# Request tests for each private main revision from the public repository.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watch-private-main
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request unit tests when main has no build run
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_TOKEN:-}" ]]; then
            echo '::warning::SOURCE_REPO_TOKEN is not configured; private main was not checked.'
            exit 0
          fi
          sha=$(GH_TOKEN="$SOURCE_TOKEN" gh api repos/cresent630-glitch/FoodCalorie-Dev/commits/main --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Private main SHA was not readable.'; exit 1; }
          # Use the public repository's own run history. The checkout token only needs source read access.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ios-build.yml/runs?branch=main&event=workflow_dispatch&per_page=100" \
            --jq ".workflow_runs[] | select(.display_title == \"Build $sha\") | .id")
          if [[ -n "$existing" ]]; then
            echo "main $sha already has a run in the public builder."
            exit 0
          fi
          gh workflow run ios-build.yml --repo "${GITHUB_REPOSITORY}" --ref main \
            -f source_sha="$sha" -f run_unit_tests=true -f run_ui_tests=false -f build_simulator_release=false -f package_ipa=false
          echo "Requested unit tests for $sha."
